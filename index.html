<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>תזכורות</title>
<style>
:root{--tx:#1c1c1e;--mut:#8a8a90;--card:#e8e8ea;--line:#e6e6ea;--sel:#0a7cff;--sheet:#fff;--gl:rgba(232,236,248,.55);--gr1:rgba(255,255,255,.55);--gr2:rgba(255,255,255,.9);--gr3:rgba(255,255,255,.4);--gsh:rgba(30,40,90,.18);
--bg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#f5f5f7;--mut:#9a9aa2;--card:#2c2c2f;--line:#38383c;--sheet:#1c1c1e;--gl:rgba(70,70,80,.28);--gr1:rgba(255,255,255,.22);--gr2:rgba(255,255,255,.4);--gr3:rgba(255,255,255,.15);--gsh:rgba(0,0,0,.5);--bg:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;color:var(--tx);background:var(--bg);font:13.5px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Heebo,Arial,sans-serif}
button,input{font:inherit;color:inherit}
.win{position:absolute;z-index:1;left:0;top:0;transform-origin:0 0;display:flex;gap:0;padding:0;width:100%;height:100%}
svg.i{width:1em;height:1em;display:block}
/* ===== Liquid Glass ===== */
.lg{position:relative;background:none;box-shadow:0 14px 28px -10px var(--gsh),0 2px 6px rgba(40,50,100,.10);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tile.lg:active{transform:scale(.97)}
.row.lg,.flat .row.lg{border-radius:14px;margin-bottom:6px;padding:9px 12px;border-bottom:0}
.sh2.lg{border-radius:14px;padding:8px 12px;border-bottom:0;margin-bottom:6px}
.li.lg{margin-bottom:3px}
.card.lg,.row.lg,.sh2.lg{background:none}
#gl2{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none;display:block}
.nogl #gl2{display:none}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.nogl .lg{background:var(--gl);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8)}
.nogl .sheet{background:var(--sheet)}

.side{position:absolute;inset-inline-start:8px;top:8px;bottom:8px;width:300px;border-radius:26px;padding:14px 12px;overflow:auto;z-index:10}
.win.nosb .side{display:none}
.top{display:flex;align-items:center;height:24px;margin-bottom:8px;padding-inline:4px}
.dots{display:flex;gap:8px;direction:ltr}.dots i{width:12px;height:12px;border-radius:50%}
.ib{border:0;background:none;padding:4px 6px;cursor:pointer;font-size:20px;opacity:.8}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{position:relative;border:0;border-radius:15px;height:60px;color:#fff;text-align:start;cursor:pointer;overflow:hidden}
.tile .g{position:absolute;inset-inline-start:11px;top:9px;font-size:19px}
.tile b{position:absolute;inset-inline-end:11px;top:3px;font-size:26px;font-weight:700}
.tile span.l{position:absolute;inset-inline-start:11px;bottom:7px;font-size:14px;font-weight:600;white-space:nowrap}
.tile .av{position:absolute;inset-inline-end:8px;bottom:6px;width:20px;height:20px;border-radius:50%;background:#c9a27a;box-shadow:0 0 0 1.5px #fff6}
.tile.on{box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.95),inset 0 -12px 20px -10px var(--gr3)}
.lbl{color:var(--mut);font-weight:600;padding:0 8px 6px;font-size:12.5px}
.li{display:flex;align-items:center;gap:10px;height:31px;padding-inline:6px 12px;border-radius:999px;cursor:pointer;font-size:14.5px}
.li.on{background:rgba(10,124,255,.78);color:#fff}
.li .n{margin-inline-start:auto;color:var(--mut)}.li.on .n{color:#dcebff}.li .sh{opacity:.5;font-size:17px;margin-inline-start:auto}.li .sh+.n{margin-inline-start:10px}
.ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff;flex:none}
.sheet{flex:1;min-width:0;background:transparent;border-radius:0;overflow:auto;padding:0 32px 60px;padding-inline-start:340px;position:relative}
.tb{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-start;gap:10px;padding:12px 0 8px;margin-inline:-6px;padding-inline:6px}
.pill{display:flex;border-radius:999px;padding:3px 5px;height:38px;align-items:center}
.pill button{border:0;background:none;width:38px;height:32px;display:grid;place-items:center;font-size:20px;cursor:pointer}
.srch{display:flex;align-items:center;gap:6px;border-radius:999px;padding:0 14px;height:38px;width:210px}
.srch input{border:0;background:none;outline:0;width:100%}
.sp{flex:1}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.4px}.cnt{font-size:36px;font-weight:800}
.sub{display:flex;justify-content:space-between;color:var(--mut);margin:2px 0 18px;font-size:14px}
.sub button{border:0;background:none;cursor:pointer;padding:0}
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.col{flex:1 1 0;min-width:0}
.col h3{margin:0 0 10px;font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.col h3 button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.card{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:14.5px}
.ck{width:18px;height:18px;border-radius:50%;border:1.3px solid #9a9aa2;background:none;padding:0;flex:none;margin-top:1px;cursor:pointer}
.ck.d{background:var(--c,var(--sel));border-color:var(--c,var(--sel))}.dash{border-style:dashed;opacity:.6}
.t{flex:1;min-width:0}.t small{display:block;color:var(--mut);font-size:12px;margin-top:1px}.tg{color:#4a6fb0;font-size:12px;display:block}
.done .t>span{text-decoration:line-through;color:var(--mut)}
.x{border:0;background:none;cursor:pointer;color:var(--mut);opacity:0;padding:0 2px}.card:hover .x,.row:hover .x{opacity:1}
.add input{flex:1;border:0;background:none;outline:0;min-width:0;width:100%}.card.add{min-height:36px;align-items:center}
.sh2{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}
.sh2 .chev{margin-inline-start:auto;border:0;background:none;cursor:pointer;color:var(--mut);font-size:16px;transition:transform .15s}.sec.c .chev{transform:rotate(90deg)}.sec.c .body{display:none}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 28px 9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.flat .row{padding-inline:0}.gh{margin:16px 0 4px;font-weight:700;font-size:16px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
html,body{overflow:hidden;position:fixed;inset:0;width:100%;height:100%;touch-action:pan-x pan-y;overscroll-behavior:none;padding:0}
</style>
</head>

 m.innerHTML=`<div class="tb"><div class="pill lg" data-bz="19" data-sc="26" data-bl="1"><button data-act="who" aria-label="הקצאה">${I("who")}</button><button data-act="share" aria-label="שיתוף">${I("share")}</button><button data-act="view" aria-label="תצוגה">${I("sort")}</button><button data-act="add" aria-label="תזכורת חדשה">${I("plus")}</button></div><span class="sp"></span><div class="srch lg" data-bz="19" data-sc="26" data-bl="1"><span style="opacity:.55;font-size:17px;display:grid">${I("srch")}</span><input id="q" placeholder="חיפוש" value="${esc(S.q)}"></div></div><div id="cn" data-v="${window._v=(window._v||0)+1}"><div class="head"><h1 style="color:${color}">${esc(title)}</h1><div class="cnt" style="color:${color}">${open}</div></div>

/* ===== Liquid Glass: WebGL, per-pixel refraction of the wallpaper AND of the page content behind it ===== */
const VS="attribute vec2 a;uniform vec2 uRes;uniform vec4 uQ;varying vec2 vP;void main(){vec2 p=uQ.xy+a*uQ.zw;vP=p;vec2 c=p/uRes*2.-1.;gl_Position=vec4(c.x,-c.y,0.,1.);}";
const FS=`precision highp float;
varying vec2 vP;uniform vec2 uRes,uL;uniform vec4 uR,uSR;uniform float uRad,uMode,uDark,uHas;uniform sampler2D uS;
vec3 wall(vec2 p){
 bool d=uDark>.5;vec3 c=d?vec3(.085,.085,.1):vec3(1.);
 float st=smoothstep(.44,.5,abs(fract((p.x+p.y)/70.)-.5));
 return c-vec3(d?-.014:.016)*st;
}
vec3 bk(vec2 p){
 vec3 w=wall(p);
 if(uHas>.5){
  vec2 uv=(p-uSR.xy)/uSR.zw;
  if(uv.x>0.&&uv.x<1.&&uv.y>0.&&uv.y<1.){
   vec2 dx=vec2(2.2,0.)/uSR.zw,dy=vec2(0.,2.2)/uSR.zw;
   vec4 s=(texture2D(uS,uv)*2.+texture2D(uS,uv+dx)+texture2D(uS,uv-dx)+texture2D(uS,uv+dy)+texture2D(uS,uv-dy))/6.;
   w=w*(1.-s.a)+s.rgb;
  }
 }
 return w;
}
float sdf(vec2 p){vec2 c=uR.xy+uR.zw*.5,h=uR.zw*.5-uRad,q=abs(p-c)-h;return length(max(q,0.))+min(max(q.x,q.y),0.)-uRad;}
void main(){
 if(uMode<.5){gl_FragColor=vec4(wall(vP),1.);return;}
 float d=sdf(vP),aa=1.-smoothstep(-1.,.6,d);
 if(aa<=0.)discard;
 bool dk=uDark>.5;
 float dep=-d,B=min(uRad+10.,min(uR.z,uR.w)*.5);
 vec2 e=vec2(.8,0.);
 vec2 n=normalize(vec2(sdf(vP+e.xy)-sdf(vP-e.xy),sdf(vP+e.yx)-sdf(vP-e.yx))+vec2(1e-5));
 float t=clamp(1.-dep/B,0.,1.);
 vec3 N=normalize(vec3(n*pow(t,1.4)*1.7,1.));
 float k=t*t*B*2.4;
 vec2 cen=uR.xy+uR.zw*.5;
 vec2 pc=cen+(vP-cen)*.97;
 vec3 col=vec3(bk(pc-n*k).r,bk(pc-n*k*1.1).g,bk(pc-n*k*1.2).b);
 vec2 l=normalize(uL-cen);float f=dot(n,l);
 float gy=clamp((vP.y-uR.y)/uR.w,0.,1.);
 col=mix(col,dk?vec3(.22,.23,.28):vec3(.96,.968,.99),.22);
 col*=1.+.03*(.5-gy);
 vec3 R=reflect(vec3(0.,0.,-1.),N);
 float s1=smoothstep(.1,.9,dot(R.xy,l)*.5+.5);
 vec3 env=mix(dk?vec3(.25,.3,.45):vec3(.74,.84,1.),dk?vec3(.62,.64,.78):vec3(1.),s1);
 env+=vec3(.35,.05,.2)*.4*smoothstep(.2,1.,-dot(R.xy,l))*(dk?.6:1.);
 float F=clamp(pow(1.-N.z,1.6)*1.3+.02,0.,.9);
 col=mix(col,env,F);
 float ring=exp(-pow((dep-B*.55)/(B*.2),2.))*(dk?.05:.11);
 col-=vec3(.10,.07,.03)*ring*(.4+.6*max(-f,0.));
 col+=vec3(pow(t,3.)*(.9*max(f,0.)+.35*max(-f,0.)));
 col+=vec3(smoothstep(1.5,0.,dep)*(.45+.5*max(f,0.)));
 col=clamp(col,0.,1.);
 gl_FragColor=vec4(col*aa,aa);
}`;
function mkGL(cv,alpha){
 let gl=null;
 try{gl=cv.getContext("webgl",{alpha:alpha,antialias:false,premultipliedAlpha:true})}catch(e){}
 if(!gl)return null;
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(pr));return null}
 gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
 const a=gl.getAttribLocation(pr,"a");gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
 const U={};["uRes","uQ","uR","uRad","uMode","uDark","uL","uSR","uHas","uS"].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
 const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
 [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(x=>gl.texParameteri(gl.TEXTURE_2D,x[0],x[1]));
 gl.uniform1i(U.uS,0);
 cv.addEventListener("webglcontextlost",e=>e.preventDefault());cv.addEventListener("webglcontextrestored",()=>location.reload());
 return {gl,cv,U,tex};
}
const G1=mkGL(document.getElementById("gl"),false),G2=mkGL(document.getElementById("gl2"),true);
if(!G1||!G2){document.documentElement.classList.add("nogl");document.getElementById("gl").style.display="none";document.getElementById("gl2").style.display="none"}
const SC=document.createElement("canvas"),sx=SC.getContext("2d");
function scene(box,K){
 const sd=Math.min(devicePixelRatio||1,1.5);
 SC.width=Math.max(1,Math.ceil(box.w*sd));SC.height=Math.max(1,Math.ceil(box.h*sd));
 sx.setTransform(1,0,0,1,0,0);sx.clearRect(0,0,SC.width,SC.height);
 sx.setTransform(sd,0,0,sd,-box.x*sd,-box.y*sd);
 const hit=r=>r.right>box.x&&r.left<box.x+box.w&&r.bottom>box.y&&r.top<box.y+box.h;
 const main=document.getElementById("main"),dk=matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.dataset.theme!=="light";
 main.querySelectorAll(".card,.row,.sh2").forEach(el=>{
  const r=el.getBoundingClientRect();if(!hit(r))return;
  const rad=Math.min((parseFloat(getComputedStyle(el).borderTopLeftRadius)||12)*K,r.width/2,r.height/2);
  sx.beginPath();sx.roundRect?sx.roundRect(r.left,r.top,r.width,r.height,rad):sx.rect(r.left,r.top,r.width,r.height);
  sx.fillStyle=dk?"rgba(70,72,90,.9)":"rgba(238,241,250,.95)";sx.fill();sx.strokeStyle=dk?"rgba(255,255,255,.12)":"rgba(110,120,170,.25)";sx.lineWidth=1.2*K;sx.stroke();
 });
 main.querySelectorAll(".ck").forEach(el=>{
  if(el.closest(".tb"))return;const r=el.getBoundingClientRect();if(!hit(r))return;
  sx.beginPath();sx.arc(r.left+r.width/2,r.top+r.height/2,r.width/2-.7*K,0,7);
  if(el.classList.contains("d")){sx.fillStyle=getComputedStyle(el).backgroundColor;sx.fill()}
  sx.setLineDash(el.classList.contains("dash")?[3*K,3*K]:[]);sx.strokeStyle="#9a9aa2";sx.lineWidth=1.4*K;sx.stroke();sx.setLineDash([]);
 });
 const wk=document.createTreeWalker(main,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&!n.parentElement.closest(".tb")?1:2});
 const rg=document.createRange();let n;
 while(n=wk.nextNode()){
  rg.selectNodeContents(n);const rs=rg.getClientRects();if(!rs.length)continue;const r=rs[0];if(!hit(r))continue;
  const cs=getComputedStyle(n.parentElement);
  sx.font=`${cs.fontStyle} ${cs.fontWeight} ${parseFloat(cs.fontSize)*K}px ${cs.fontFamily}`;sx.fillStyle=cs.color;
  sx.textAlign="center";sx.textBaseline="middle";sx.direction=cs.direction||"rtl";
  sx.fillText(n.nodeValue.trim(),r.left+r.width/2,r.top+r.height/2+.5*K);
 }
}
function paint(g,wallFirst,list,box,K,dk,vw,vh,dpr){
 const {gl,cv,U}=g,W=Math.round(vw*dpr),H=Math.round(vh*dpr);
 if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
 gl.viewport(0,0,W,H);gl.disable(gl.SCISSOR_TEST);
 const L=window._L||[-9999,-9999];
 gl.uniform2f(U.uRes,vw,vh);gl.uniform1f(U.uDark,dk?1:0);gl.uniform2f(U.uL,L[0],L[1]);
 if(wallFirst){gl.disable(gl.BLEND);gl.uniform4f(U.uQ,0,0,vw,vh);gl.uniform1f(U.uMode,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
 else{gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}
 if(box){scene(box,K);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,g.tex);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,SC);gl.uniform4f(U.uSR,box.x,box.y,box.w,box.h);gl.uniform1f(U.uHas,1)}
 else gl.uniform1f(U.uHas,0);
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.uniform1f(U.uMode,1);
 const sd=document.getElementById("side"),sr=sd.getBoundingClientRect();
 for(const [e,rk] of list){
  const r=e.getBoundingClientRect();if(r.width<2||r.height<2||r.bottom<0||r.top>vh||r.right<0||r.left>vw)continue;
  const rad=Math.min((parseFloat(getComputedStyle(e).borderTopLeftRadius)||12)*K,r.width/2,r.height/2);
  if(rk===1&&e!==sd){gl.enable(gl.SCISSOR_TEST);gl.scissor(Math.round(sr.left*dpr),Math.round((vh-sr.bottom)*dpr),Math.round(sr.width*dpr),Math.round(sr.height*dpr))}else gl.disable(gl.SCISSOR_TEST);
  const p=3;gl.uniform4f(U.uQ,r.left-p,r.top-p,r.width+2*p,r.height+2*p);gl.uniform4f(U.uR,r.left,r.top,r.width,r.height);gl.uniform1f(U.uRad,rad);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
}
let _gq=0;
function glass(){if(!G1||!G2||_gq)return;_gq=requestAnimationFrame(()=>{_gq=0;draw()})}
function draw(){
 const vw=innerWidth,vh=innerHeight,dpr=Math.min(devicePixelRatio||1,2),K=window._s||1,th=document.documentElement.dataset.theme,dk=th==="dark"||(th!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
 const all=[...document.querySelectorAll(".lg")],top=all.filter(e=>e.matches(".pill,.srch")).map(e=>[e,2]);
 const rest=all.filter(e=>!e.matches(".pill,.srch")).map(e=>[e,e.closest(".side")?1:0]).sort((x,y)=>x[1]-y[1]);
 let box=null;
 if(top.length){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;top.forEach(([e])=>{const r=e.getBoundingClientRect();x0=Math.min(x0,r.left);y0=Math.min(y0,r.top);x1=Math.max(x1,r.right);y1=Math.max(y1,r.bottom)});box={x:Math.max(0,x0-30),y:Math.max(0,y0-30),w:Math.min(vw,x1+30)-Math.max(0,x0-30),h:Math.min(vh,y1+30)-Math.max(0,y0-30)}}
 paint(G1,true,rest,null,K,dk,vw,vh,dpr);
 paint(G2,false,top,box,K,dk,vw,vh,dpr);
}
